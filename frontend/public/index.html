        <h1>Perpetual PSM - Enterprise Process Safety Management Platform</h1>
        <p>
          Perpetual PSM is a modern cloud-native Process Safety Management and Process Hazard Analysis platform engineered for safety teams, Scribers, and facility managers across chemical, refining, and industrial plants.
        </p>
        <h2>Key Modules & Capabilities</h2>
        <ul>
          <li><strong>PHA / HAZOP Worksheets:</strong> Structured deviation, cause, consequence, and safeguard mapping with risk matrices.</li>
          <li><strong>Layer of Protection Analysis (LOPA):</strong> Quantitative SIL determination and Independent Protection Layer (IPL) verification.</li>
          <li><strong>Management of Change (MOC):</strong> Automated 7-stage approval workflow from initiation to PSSR and closure.</li>
          <li><strong>BowTie Risk Analysis:</strong> Clear visualization of threats, prevention barriers, top events, and mitigation controls.</li>
          <li><strong>Recommendation & Action Item Tracking:</strong> Centralized hub to assign owners, track due dates, and monitor closure status.</li>
          <li><strong>Compliance Standards:</strong> Aligned with OSHA 1910.119, CCPS Risk Based Process Safety (RBPS), and IEC 61511.</li>
        </ul>
